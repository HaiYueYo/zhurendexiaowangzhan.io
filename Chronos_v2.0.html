<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos · 晨昏极光清单 v2.0</title>
    <style>
        :root {
            --bg-base: #070a13;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.45);
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.45);
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --glass-card: rgba(18, 24, 38, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-overlay: rgba(7, 10, 19, 0.4);
            --bg-blur: 0px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            padding: 30px 16px 80px 16px;
            position: relative;
        }

        /* 全局动态壁纸背景层 */
        .wallpaper-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: filter 0.3s ease, background 0.5s ease;
            filter: blur(var(--bg-blur));
        }

        .wallpaper-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            background: var(--bg-overlay);
            transition: background 0.3s ease;
        }

        /* 预设极光微粒 */
        .aurora-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* 仅在极光主题开启 */
        }

        .aurora-blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.42;
            border-radius: 50%;
            animation: float 22s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 {
            width: 580px;
            height: 580px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            top: -140px;
            left: -120px;
            animation-duration: 26s;
        }

        .blob-2 {
            width: 650px;
            height: 650px;
            background: linear-gradient(135deg, #c026d3, #7c3aed);
            bottom: -200px;
            right: -100px;
            animation-duration: 32s;
            animation-delay: -6s;
        }

        .blob-3 {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #f43f5e, #f59e0b);
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 20s;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(70px, 50px) scale(1.1); }
            100% { transform: translate(-50px, 90px) scale(0.92); }
        }

        /* 主容器 */
        .app-container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 顶部仪表盘 */
        .header-card {
            background: var(--glass-card);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
        }

        .greeting h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .version-tag {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            -webkit-text-fill-color: initial;
            font-weight: 600;
            vertical-align: middle;
        }

        .greeting p {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-badge {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            font-size: 0.82rem;
            color: var(--accent-cyan);
        }

        .stats-ring-box {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .progress-circle {
            position: relative;
            width: 82px;
            height: 82px;
            flex-shrink: 0;
        }

        .progress-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-circle circle {
            fill: none;
            stroke-width: 7;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .circle-bar {
            stroke: url(#cyan-gradient);
            stroke-dasharray: 226;
            stroke-dashoffset: 226;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* 顶部操作区：壁纸按钮与快捷管理 */
        .top-action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: -10px;
        }

        .icon-btn {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: white;
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        /* 录入面板 */
        .creator-card {
            background: var(--glass-card);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 20px 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .task-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 13px 18px;
            color: white;
            font-size: 0.98rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .task-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(0, 0, 0, 0.4);
        }

        .shake-error {
            animation: shake 0.4s ease-in-out;
            border-color: var(--accent-rose) !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
        }

        .options-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .selector {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .selector:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .selector option {
            background: #0f172a;
            color: white;
        }

        .type-toggle-wrapper {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 3px;
            border: 1px solid var(--glass-border);
        }

        .toggle-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 6px 14px;
            font-size: 0.82rem;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .toggle-btn.active[data-type="recurring"] {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 3px 10px var(--primary-glow);
        }

        .toggle-btn.active[data-type="temporary"] {
            background: linear-gradient(135deg, #06b6d4, #0284c7);
            color: white;
            box-shadow: 0 3px 10px var(--accent-cyan-glow);
        }

        .add-btn {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            border: none;
            padding: 9px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 18px rgba(6, 182, 212, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.45);
        }

        /* 筛选与搜索工具条 */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 2px;
        }

        .filter-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 7px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: 600;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 6px 14px 6px 32px;
            font-size: 0.82rem;
            color: white;
            outline: none;
            width: 160px;
            transition: all 0.3s;
        }

        .search-input:focus {
            width: 210px;
            background: rgba(0, 0, 0, 0.35);
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 13px;
            height: 13px;
        }

        /* 任务清单列表 */
        .tasks-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            min-height: 120px;
        }

        /* 任务卡片设计 */
        .task-card {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease, opacity 0.2s ease, border-color 0.2s;
        }

        .task-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 4px 0 0 4px;
        }

        .task-card.type-recurring::before {
            background: linear-gradient(to bottom, #818cf8, #a855f7);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .task-card.type-temporary::before {
            background: linear-gradient(to bottom, #06b6d4, #3b82f6);
            box-shadow: 0 0 10px var(--accent-cyan-glow);
        }

        .task-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .task-card.completed {
            opacity: 0.52;
            background: rgba(14, 18, 27, 0.45);
        }

        .task-card.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* 拖拽浮动层 */
        .task-card.is-floating {
            position: fixed !important;
            z-index: 99999 !important;
            pointer-events: none !important;
            transition: none !important;
            transform: scale(1.02) rotate(1deg);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 25px var(--primary-glow);
            border-color: rgba(99, 102, 241, 0.6);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
        }

        .task-card.is-snapping {
            transition: transform 0.24s cubic-bezier(0.175, 0.885, 0.32, 1.15), top 0.24s cubic-bezier(0.175, 0.885, 0.32, 1.15), left 0.24s cubic-bezier(0.175, 0.885, 0.32, 1.15) !important;
            transform: scale(1) rotate(0deg) !important;
        }

        /* 占位卡槽 */
        .task-placeholder {
            border: 2px dashed rgba(99, 102, 241, 0.45);
            background: rgba(99, 102, 241, 0.05);
            border-radius: 18px;
            box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.08);
            transition: height 0.15s ease;
            flex-shrink: 0;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        /* 拖动手柄 */
        .drag-handle {
            cursor: grab;
            color: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
            touch-action: none;
            flex-shrink: 0;
        }

        .drag-handle:hover {
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.08);
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        /* 复选框 Checkbox */
        .checkbox-container {
            width: 22px;
            height: 22px;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-container input {
            opacity: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            cursor: pointer;
            z-index: 2;
        }

        .custom-checkmark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 7px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-container:hover .custom-checkmark {
            border-color: var(--primary);
        }

        .checkbox-container input:checked ~ .custom-checkmark {
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            border-color: transparent;
        }

        .custom-checkmark svg {
            fill: none;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 13px;
            height: 13px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .checkbox-container input:checked ~ .custom-checkmark svg {
            opacity: 1;
            transform: scale(1);
        }

        .task-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 0;
        }

        .task-text {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.2s;
            word-break: break-word;
            cursor: text;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* 徽标 */
        .badge {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-type-recurring {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.35);
        }

        .badge-type-temp {
            background: rgba(6, 182, 212, 0.15);
            color: #67e8f9;
            border: 1px solid rgba(6, 182, 212, 0.35);
        }

        .badge-priority-high {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .badge-priority-medium {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-priority-low {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .badge-category {
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
        }

        .task-right {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.65;
        }

        .action-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .action-btn.delete:hover {
            color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.15);
        }

        .action-btn.edit:hover {
            color: #67e8f9;
            background: rgba(6, 182, 212, 0.15);
        }

        .task-text {
            caret-color: var(--accent-cyan);
        }

        .edit-form {
            display: grid;
            gap: 14px;
        }

        .edit-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .edit-field label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 2px;
        }

        .secondary-btn,
        .primary-btn {
            border: 1px solid var(--glass-border);
            padding: 9px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
        }

        .secondary-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .primary-btn {
            border-color: transparent;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            box-shadow: 0 4px 16px rgba(6, 182, 212, 0.25);
        }

        .primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 20px rgba(6, 182, 212, 0.35);
        }

        .edit-hint {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: -4px;
        }

        .modal-panel {
            max-height: min(88vh, 720px);
            overflow: auto;
        }

        @media (max-width: 650px) {
            .task-input {
                font-size: 16px;
            }

            .edit-grid {
                grid-template-columns: 1fr;
            }

            .task-right {
                margin-left: 4px;
                gap: 2px;
            }

            .action-btn {
                opacity: 0.9;
            }

            .search-box {
                width: 100%;
            }

            .search-input,
            .search-input:focus {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.001ms !important;
            }
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            background: var(--glass-card);
            border-radius: 18px;
            border: 1px dashed var(--glass-border);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
            opacity: 0.35;
            margin-bottom: 12px;
        }

        /* 模态弹窗系统 (壁纸配置 & 数据管理) */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);

    <script>
        /**
         * Web Audio 音效系统 (防爆音、兼容浏览器策略安全唤醒)
         */
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        this.ctx = new AudioContextClass();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playCheck() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } catch(e) {}
            },
            playGrab() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(380, now + 0.05);
                    
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } catch(e) {}
            },
            playDrop() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(190, now + 0.08);
                    
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } catch(e) {}
            },
            playCompleteFanfare() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const now = this.ctx.currentTime + idx * 0.08;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                        
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.38);
                    });
                } catch(e) {}
            }
        };

        /**
         * Canvas 礼花喷发系统 (高清适配与重力物理)
         */
        const Confetti = {
            canvas: document.getElementById('confetti-canvas'),
            ctx: document.getElementById('confetti-canvas').getContext('2d'),
            particles: [],
            animating: false,
            initialized: false,

            init() {
                if (this.initialized) return;
                this.initialized = true;
                this.resize();
                window.addEventListener('resize', () => this.resize(), { passive: true });
            },
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            burst() {
                this.init();
                const colors = ['#06b6d4', '#3b82f6', '#f43f5e', '#10b981', '#f59e0b', '#8b5cf6'];
                for (let i = 0; i < 70; i++) {
                    this.particles.push({
                        x: window.innerWidth / 2,
                        y: window.innerHeight * 0.42,
                        w: Math.random() * 8 + 4,
                        h: Math.random() * 6 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        vx: (Math.random() - 0.5) * 16,
                        vy: (Math.random() - 0.75) * 16,
                        gravity: 0.4,
                        rotation: Math.random() * 360,
                        vRot: (Math.random() - 0.5) * 12,
                        opacity: 1
                    });
                }
                if (!this.animating) {
                    this.animating = true;
                    this.render();
                }
            },
            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rotation += p.vRot;
                    p.opacity -= 0.016;

                    if (p.opacity <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate((p.rotation * Math.PI) / 180);
                    this.ctx.globalAlpha = Math.max(0, p.opacity);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    this.ctx.restore();
                }

                if (this.particles.length > 0) {
                    requestAnimationFrame(() => this.render());
                } else {
                    this.animating = false;
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
        };

        /**
         * 全功能壁纸系统 WallpaperManager
         */
        const WallpaperManager = {
            presets: [
                { id: 'aurora', name: '🌌 晨昏极光', type: 'aurora', preview: 'linear-gradient(135deg, #070a13, #1e1b4b, #0f172a)' },

                { id: 'forest', name: '🌲 雾霭冷杉', type: 'gradient', val: 'linear-gradient(135deg, #0b2027 0%, #203a43 50%, #2c5364 100%)', preview: 'linear-gradient(135deg, #0b2027 0%, #203a43 50%, #2c5364 100%)' },

                        this.config = Object.assign(this.config, JSON.parse(saved));

            saveConfig() {
                try { localStorage.setItem('chronos_wallpaper_config_v2', JSON.stringify(this.config)); } catch (e) { showToast('外观设置保存失败，可能是浏览器存储空间不足'); }
            },
            renderPresetButtons() {
                const grid = document.getElementById('wallpaper-presets');
                grid.innerHTML = this.presets.map(p => `
                    <div class="wp-item ${this.config.presetId === p.id && !this.config.customImage ? 'active' : ''}" 
                         style="background: ${p.preview}" 
                         onclick="WallpaperManager.selectPreset('${p.id}')">
                        ${p.name}
                    </div>
                `).join('');
            },
            selectPreset(id) {
                this.config.presetId = id;
                this.config.customImage = ''; // 切换预设时清除自定义图
                this.saveConfig();
                this.renderPresetButtons();
                this.apply();
                showToast('已更换壁纸预设');
            },
            apply() {
                const layer = document.getElementById('wallpaper-layer');
                const overlay = document.getElementById('wallpaper-overlay');
                const auroraBlobs = document.getElementById('aurora-blobs');

                // 模糊度与遮罩透明度
                document.documentElement.style.setProperty('--bg-blur', `${this.config.blur}px`);
                overlay.style.background = `rgba(7, 10, 19, ${this.config.overlayOpacity / 100})`;

                if (this.config.customImage) {
                    auroraBlobs.style.display = 'none';
                    layer.style.backgroundImage = `url(${this.config.customImage})`;
                    layer.style.backgroundSize = 'cover';
                    layer.style.backgroundPosition = 'center';
                } else {
                    const preset = this.presets.find(p => p.id === this.config.presetId) || this.presets[0];
                    if (preset.type === 'aurora') {
                        layer.style.backgroundImage = 'none';
                        layer.style.backgroundColor = 'var(--bg-base)';
                        auroraBlobs.style.display = 'block';
                    } else {
                        auroraBlobs.style.display = 'none';
                        layer.style.backgroundImage = preset.val.startsWith('linear') || preset.val.startsWith('radial') ? preset.val : 'none';
                        layer.style.backgroundColor = preset.val.startsWith('#') ? preset.val : 'transparent';
                    }
                }

                // 同步滑块 DOM 显式数值
                document.getElementById('overlay-slider').value = this.config.overlayOpacity;
                document.getElementById('overlay-val-text').textContent = `${this.config.overlayOpacity}%`;
                document.getElementById('blur-slider').value = this.config.blur;
                document.getElementById('blur-val-text').textContent = `${this.config.blur}px`;
            },
            bindEvents() {
                document.getElementById('open-wallpaper-modal-btn').addEventListener('click', () => {
                    const modal = document.getElementById('wallpaper-modal');
                    modal.classList.add('show');
                    modal.setAttribute('aria-hidden', 'false');
                });

                document.getElementById('overlay-slider').addEventListener('input', (e) => {
                    this.config.overlayOpacity = parseInt(e.target.value);
                    document.getElementById('overlay-val-text').textContent = `${this.config.overlayOpacity}%`;
                    this.apply();
                    this.saveConfig();
                });

                document.getElementById('blur-slider').addEventListener('input', (e) => {
                    this.config.blur = parseInt(e.target.value);
                    document.getElementById('blur-val-text').textContent = `${this.config.blur}px`;
                    this.apply();
                    this.saveConfig();
                });

                // 本地图片上传
                document.getElementById('local-wp-file').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        if (file.size > 5 * 1024 * 1024) {
                            showToast('图片尺寸过大，请选择 5MB 以下图片');
                            return;
                        }
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            this.config.customImage = event.target.result;
                            this.saveConfig();
                            this.renderPresetButtons();
                            this.apply();
                            showToast('自定义本地壁纸已生效');
                        };
                        reader.readAsDataURL(file);
                    }
                });

                // URL 壁纸回车设定
                document.getElementById('custom-wp-url').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const url = e.target.value.trim();
                        if (url) {
                            try {
                                const parsed = new URL(url, window.location.href);
                                if (!['http:', 'https:', 'data:'].includes(parsed.protocol)) throw new Error('unsupported protocol');
                                this.config.customImage = parsed.href;
                                this.saveConfig();
                                this.renderPresetButtons();
                                this.apply();
                                showToast('网络壁纸已加载');
                                e.target.value = '';

                                showToast('请输入有效的图片 URL（http/https）');

            closeModal() {
                const modal = document.getElementById('wallpaper-modal');
                modal.classList.remove('show');
                modal.setAttribute('aria-hidden', 'true');

        /**
         * 全局 Toast
         */
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2300);
        }

        /**
         * 任务主控架构 TaskManager (修复东八区时区打卡Bug、强化拖拽重排和数据自愈)
         */
        class TaskManager {
            constructor() {
                this.tasks = [];
                this.activeFilter = 'all';
                this.currentType = 'recurring';
                this.editingTaskId = null;
                this.lastFocusElement = null;
                this.streak = 1;
                this.dragState = {
                    active: false,
                    card: null,
                    placeholder: null,
                    taskId: null,
                    pointerId: null,
                    startX: 0,
                    startY: 0,
                    offsetX: 0,
                    offsetY: 0,
                    width: 0,
                    height: 0,
                    hasMoved: false
                };
                this.init();
            }

            init() {
                this.loadTasks();
                this.checkDailyReset();
                this.bindEvents();
                this.initUltraFluidDragEngine();
                this.renderDate();
                this.render();
            }

            getLocalDateString(d = new Date()) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const date = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${date}`;
            }

            normalizeTask(task, index = 0) {
                if (!task || typeof task !== 'object') return null;
                const text = typeof task.text === 'string' ? task.text.trim().slice(0, 120) : '';
                if (!text) return null;
                const type = task.type === 'temporary' ? 'temporary' : 'recurring';
                const priority = ['high', 'medium', 'low'].includes(task.priority) ? task.priority : 'medium';
                const categories = ['🎯 专注', '💼 工作', '📚 学习', '💪 健身', '🌿 生活'];
                const category = categories.includes(task.category) ? task.category : '🎯 专注';
                const rawId = typeof task.id === 'string' ? task.id.trim() : '';
                const id = /^[A-Za-z0-9_-]{1,80}$/.test(rawId)
                    ? rawId
                    : `task_${Date.now()}_${index}_${Math.random().toString(36).slice(2, 7)}`;
                return { id, text, type, priority, category, completed: Boolean(task.completed) };
            }

            sanitizeTasks(data) {
                if (!Array.isArray(data)) return [];
                const seen = new Set();
                const result = [];
                data.forEach((raw, index) => {
                    const task = this.normalizeTask(raw, index);
                    if (!task || seen.has(task.id)) return;
                    seen.add(task.id);
                    result.push(task);
                });
                return result;
            }

            checkDailyReset() {
                const lastRunDate = localStorage.getItem('chronos_last_date_v2') || localStorage.getItem('chronos_last_date_v1');
                const todayStr = this.getLocalDateString();
                const storedStreak = parseInt(localStorage.getItem('chronos_streak_v2') || localStorage.getItem('chronos_streak_v1') || '1', 10);

                if (lastRunDate !== todayStr) {
                    this.tasks.forEach(task => {
                        if (task.type === 'recurring') task.completed = false;
                    });

                    if (lastRunDate) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        const yesterdayStr = this.getLocalDateString(yesterday);
                        this.streak = lastRunDate === yesterdayStr ? Math.max(1, storedStreak) + 1 : 1;
                    } else {
                        this.streak = 1;
                    }

                    try {
                        localStorage.setItem('chronos_streak_v2', String(this.streak));
                        localStorage.setItem('chronos_last_date_v2', todayStr);
                    } catch (e) {}
                    this.saveTasks();
                } else {
                    this.streak = Math.max(1, storedStreak);
                }
                document.getElementById('streak-badge').textContent = `⚡ 规律打卡第 ${this.streak} 天`;
            }

            loadTasks() {
                const savedV2 = localStorage.getItem('chronos_tasks_v2');
                const savedV1 = localStorage.getItem('chronos_tasks_v1');
                try {
                    const parsed = savedV2 ?? savedV1;
                    if (parsed) {
                        this.tasks = this.sanitizeTasks(JSON.parse(parsed));
                        if (!savedV2) this.saveTasks();
                        return;
                    }
                } catch (e) {
                    this.tasks = [];
                    showToast('检测到损坏的日程数据，已自动恢复为空列表');
                }

                this.tasks = [
                    { id: 't-1', text: '🌅 晨间温水 & 冥想 10 分钟', type: 'recurring', priority: 'high', category: '🌿 生活', completed: false },
                    { id: 't-2', text: '⚡ 核心系统重构与架构性能调优', type: 'recurring', priority: 'high', category: '🎯 专注', completed: false },
                    { id: 't-3', text: '📦 下午取顺丰冷链包裹', type: 'temporary', priority: 'low', category: '🌿 生活', completed: false },
                    { id: 't-4', text: '🏋️ 晚间力量训练 45 分钟', type: 'recurring', priority: 'medium', category: '💪 健身', completed: false }
                ];
                this.saveTasks();
            }

            saveTasks() {
                try {
                    localStorage.setItem('chronos_tasks_v2', JSON.stringify(this.sanitizeTasks(this.tasks)));
                    return true;
                } catch (e) {
                    showToast('日程保存失败，浏览器存储空间可能不足');
                    return false;
                }
            }

            addTask(text, type, priority, category) {
                const normalized = this.normalizeTask({
                    id: `task_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                    text, type, priority, category, completed: false
                });
                if (!normalized) return false;
                this.tasks.unshift(normalized);
                this.saveTasks();
                this.render();
                showToast('日程已添加');
                return true;
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (!task) return;
                task.completed = !task.completed;
                if (task.completed) {
                    SoundFX.playCheck();
                    Confetti.burst();
                }
                this.saveTasks();
                this.render();

                if (this.tasks.length > 0 && this.tasks.every(t => t.completed)) {
                    SoundFX.playCompleteFanfare();
                    showToast('🌟 太棒了！今日全部目标已顺利达成！');
                }
            }

            deleteTask(id) {
                const removed = this.tasks.find(t => t.id === id);
                if (!removed) return;
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
                showToast('已移除该日程');
            }

            editTask(id, updates) {
                const task = this.tasks.find(t => t.id === id);
                if (!task) return false;
                const patch = typeof updates === 'string' ? { text: updates } : (updates || {});
                const next = this.normalizeTask({ ...task, ...patch }, this.tasks.indexOf(task));
                if (!next) return false;
                Object.assign(task, next);
                this.saveTasks();
                this.render();
                showToast('日程已更新');
                return true;
            }

            openEditModal(id) {
                const task = this.tasks.find(t => t.id === id);
                if (!task) return;
                this.editingTaskId = id;
                this.lastFocusElement = document.activeElement;
                document.getElementById('edit-task-text').value = task.text;
                document.getElementById('edit-priority-select').value = task.priority;
                document.getElementById('edit-category-select').value = task.category;
                this.setEditType(task.type);
                this.setModalState('edit-modal', true);
                const input = document.getElementById('edit-task-text');
                requestAnimationFrame(() => { input.focus(); input.select(); });
            }

            setEditType(type) {
                document.querySelectorAll('[data-edit-type]').forEach(btn => btn.classList.toggle('active', btn.dataset.editType === type));
            }

            saveEditFromModal() {
                const id = this.editingTaskId;
                if (!id) return;
                const text = document.getElementById('edit-task-text').value.trim();
                if (!text) {
                    const input = document.getElementById('edit-task-text');
                    input.classList.add('shake-error');
                    input.focus();
                    setTimeout(() => input.classList.remove('shake-error'), 400);
                    showToast('日程内容不能为空');
                    return;
                }
                const typeBtn = document.querySelector('[data-edit-type].active');
                const type = typeBtn ? typeBtn.dataset.editType : 'recurring';
                const saved = this.editTask(id, {
                    text: text.slice(0, 120),
                    type,
                    priority: document.getElementById('edit-priority-select').value,
                    category: document.getElementById('edit-category-select').value
                });
                if (saved) this.closeEditModal();
            }

            closeEditModal() {
                this.setModalState('edit-modal', false);
                this.editingTaskId = null;
                if (this.lastFocusElement && typeof this.lastFocusElement.focus === 'function') {
                    this.lastFocusElement.focus();
                }
                this.lastFocusElement = null;
            }

            setModalState(id, isOpen) {
                const modal = document.getElementById(id);
                modal.classList.toggle('show', isOpen);
                modal.setAttribute('aria-hidden', String(!isOpen));
            }

            clearCompleted() {
                const count = this.tasks.filter(t => t.completed).length;
                if (count === 0) {
                    showToast('暂无已完成的日程');
                    return;
                }
                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveTasks();
                this.render();
                TaskManager.closeBackupModal();
                showToast(`已清理 ${count} 个已完成日程`);
            }

            exportData() {
                const payload = {
                    version: 2,
                    exportedAt: new Date().toISOString(),
                    tasks: this.sanitizeTasks(this.tasks)
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Chronos_Backup_${this.getLocalDateString()}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast('备份文件已下载');
            }

            importData(jsonString) {
                try {
                    const raw = JSON.parse(jsonString);
                    const source = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.tasks) ? raw.tasks : null);
                    if (!source) {
                        showToast('JSON 格式不符合要求');
                        return;
                    }
                    const sanitized = this.sanitizeTasks(source);
                    if (source.length > 0 && sanitized.length === 0) {
                        showToast('导入数据中没有有效日程');
                        return;
                    }
                    this.tasks = sanitized;
                    this.saveTasks();
                    this.render();
                    TaskManager.closeBackupModal();
                    showToast(`成功恢复 ${sanitized.length} 个日程`);
                } catch(e) {
                    showToast('解析导入文件失败');
                }
            }

            static closeBackupModal() {
                const modal = document.getElementById('backup-modal');
                modal.classList.remove('show');
                modal.setAttribute('aria-hidden', 'true');
            }

            initUltraFluidDragEngine() {
                const container = document.getElementById('tasks-container');

                container.addEventListener('pointerdown', (e) => {
                    const handle = e.target.closest('.drag-handle');
                    if (!handle) return;
                    const card = handle.closest('.task-card');
                    if (!card) return;

                    const rect = card.getBoundingClientRect();
                    this.dragState.active = true;
                    this.dragState.card = card;
                    this.dragState.taskId = card.dataset.id;
                    this.dragState.pointerId = e.pointerId;
                    this.dragState.startX = e.clientX;
                    this.dragState.startY = e.clientY;
                    this.dragState.offsetX = e.clientX - rect.left;
                    this.dragState.offsetY = e.clientY - rect.top;
                    this.dragState.width = rect.width;
                    this.dragState.height = rect.height;
                    this.dragState.hasMoved = false;

                    try { card.setPointerCapture(e.pointerId); } catch (err) {}
                });

                window.addEventListener('pointermove', (e) => {
                    if (!this.dragState.active || !this.dragState.card) return;

                    const moveDist = Math.hypot(e.clientX - this.dragState.startX, e.clientY - this.dragState.startY);
                    if (!this.dragState.hasMoved && moveDist > 5) {
                        this.dragState.hasMoved = true;
                        SoundFX.playGrab();

                        const { card, width, height } = this.dragState;
                        const placeholder = document.createElement('div');
                        placeholder.className = 'task-placeholder';
                        placeholder.style.width = width + 'px';
                        placeholder.style.height = height + 'px';
                        this.dragState.placeholder = placeholder;

                        card.parentNode.insertBefore(placeholder, card);
                        card.classList.add('is-floating');
                        card.style.width = width + 'px';
                        card.style.height = height + 'px';
                    }

                    if (this.dragState.hasMoved) {
                        const { card, offsetX, offsetY, placeholder } = this.dragState;
                        card.style.left = (e.clientX - offsetX) + 'px';
                        card.style.top = (e.clientY - offsetY) + 'px';

                        const siblings = [...container.querySelectorAll('.task-card:not(.is-floating)')];
                        const hoveredSibling = siblings.find(sibling => {
                            const box = sibling.getBoundingClientRect();
                            return e.clientY >= box.top && e.clientY <= box.bottom;
                        });

                        if (hoveredSibling) {
                            const box = hoveredSibling.getBoundingClientRect();
                            container.insertBefore(placeholder, e.clientY < box.top + box.height / 2 ? hoveredSibling : hoveredSibling.nextSibling);
                        }
                    }
                });

                const handlePointerUp = () => {
                    if (!this.dragState.active || !this.dragState.card) return;

                    const { card, placeholder, hasMoved, taskId } = this.dragState;
                    if (hasMoved && placeholder) {
                        const targetRect = placeholder.getBoundingClientRect();
                        card.classList.add('is-snapping');
                        card.style.left = targetRect.left + 'px';
                        card.style.top = targetRect.top + 'px';
                        SoundFX.playDrop();

                        setTimeout(() => {
                            if (!placeholder.parentNode) return;
                            card.classList.remove('is-floating', 'is-snapping');
                            card.style.width = '';
                            card.style.height = '';
                            card.style.left = '';
                            card.style.top = '';
                            placeholder.parentNode.insertBefore(card, placeholder);
                            placeholder.remove();
                            this.syncTaskOrderSmart(taskId);
                            this.render();
                        }, 220);
                    }

                    this.dragState.active = false;
                    this.dragState.card = null;
                    this.dragState.placeholder = null;
                    this.dragState.hasMoved = false;
                };

                window.addEventListener('pointerup', handlePointerUp);
                window.addEventListener('pointercancel', handlePointerUp);
            }

            syncTaskOrderSmart(draggedId) {
                const domCards = [...document.querySelectorAll('#tasks-container .task-card')];
                const currentIndex = domCards.findIndex(c => c.dataset.id === draggedId);
                if (currentIndex === -1) return;
                const draggedTask = this.tasks.find(t => t.id === draggedId);
                if (!draggedTask) return;

                this.tasks = this.tasks.filter(t => t.id !== draggedId);

                if (currentIndex === 0) {
                    const nextCard = domCards[1];
                    if (nextCard) {
                        const nextIndex = this.tasks.findIndex(t => t.id === nextCard.dataset.id);
                        this.tasks.splice(Math.max(0, nextIndex), 0, draggedTask);
                    } else {
                        this.tasks.unshift(draggedTask);
                    }
                } else {
                    const prevCard = domCards[currentIndex - 1];
                    const prevIndex = this.tasks.findIndex(t => t.id === prevCard.dataset.id);
                    this.tasks.splice(prevIndex + 1, 0, draggedTask);
                }
                this.saveTasks();
            }

            bindEvents() {
                const recurringBtn = document.getElementById('type-recurring-btn');
                const tempBtn = document.getElementById('type-temp-btn');

                recurringBtn.addEventListener('click', () => {
                    this.currentType = 'recurring';
                    recurringBtn.classList.add('active');
                    tempBtn.classList.remove('active');
                });

                tempBtn.addEventListener('click', () => {
                    this.currentType = 'temporary';
                    tempBtn.classList.add('active');
                    recurringBtn.classList.remove('active');
                });

                const input = document.getElementById('task-input');
                const addBtn = document.getElementById('add-task-btn');
                const handleAdd = () => {
                    const val = input.value;
                    const priority = document.getElementById('priority-select').value;
                    const category = document.getElementById('category-select').value;
                    if (this.addTask(val, this.currentType, priority, category)) {
                        input.value = '';
                        input.focus();
                    } else {
                        input.classList.add('shake-error');
                        setTimeout(() => input.classList.remove('shake-error'), 400);
                    }
                };

                addBtn.addEventListener('click', handleAdd);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleAdd();
                });

                document.querySelectorAll('.filter-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                        const clicked = e.currentTarget;
                        clicked.classList.add('active');
                        this.activeFilter = clicked.dataset.filter;
                        this.render();
                    });
                });

                document.getElementById('search-input').addEventListener('input', () => this.render());

                document.getElementById('backup-menu-btn').addEventListener('click', () => {
                    this.setModalState('backup-modal', true);
                });

                document.getElementById('import-json-file').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => this.importData(evt.target.result);
                        reader.readAsText(file);
                    }
                    e.target.value = '';
                });

                document.getElementById('edit-close-btn').addEventListener('click', () => this.closeEditModal());
                document.getElementById('edit-cancel-btn').addEventListener('click', () => this.closeEditModal());
                document.getElementById('edit-save-btn').addEventListener('click', () => this.saveEditFromModal());
                document.getElementById('edit-task-text').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.saveEditFromModal();
                });
                document.querySelectorAll('[data-edit-type]').forEach(btn => {
                    btn.addEventListener('click', () => this.setEditType(btn.dataset.editType));
                });

                window.addEventListener('keydown', (e) => {
                    if (e.key !== 'Escape') return;
                    const editOpen = document.getElementById('edit-modal').classList.contains('show');
                    const wallpaperOpen = document.getElementById('wallpaper-modal').classList.contains('show');
                    const backupOpen = document.getElementById('backup-modal').classList.contains('show');
                    if (editOpen) this.closeEditModal();
                    else if (wallpaperOpen) WallpaperManager.closeModal();
                    else if (backupOpen) TaskManager.closeBackupModal();
                });

                window.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('modal-backdrop')) return;
                    if (e.target.id === 'edit-modal') this.closeEditModal();
                    if (e.target.id === 'wallpaper-modal') WallpaperManager.closeModal();
                    if (e.target.id === 'backup-modal') TaskManager.closeBackupModal();
                });
            }

            renderDate() {
                const now = new Date();
                const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                document.getElementById('current-date').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;

                const hour = now.getHours();
                let greet = '早安，掌控者';
                if (hour >= 11 && hour < 14) greet = '午安，掌控者';
                if (hour >= 14 && hour < 19) greet = '下午好，掌控者';
                if (hour >= 19 || hour < 5) greet = '晚安，掌控者';
                document.getElementById('greeting-text').innerHTML = `${greet} <span class="version-tag">v2.0</span>`;
            }

            updateDashboard() {
                const total = this.tasks.length;
                const completedCount = this.tasks.filter(t => t.completed).length;
                const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
                const circleBar = document.getElementById('progress-bar');
                const circumference = 226;
                circleBar.style.strokeDashoffset = circumference - (percent / 100) * circumference;
                document.getElementById('progress-percent').textContent = `${percent}%`;
                document.getElementById('task-stats-title').textContent = `已完成 ${completedCount}/${total}`;

                if (percent === 100 && total > 0) {
                    document.getElementById('quote-text').textContent = '🎉 达成！今日所有日程均已圆满推进！';
                } else if (percent >= 50) {
                    document.getElementById('quote-text').textContent = '⚡ 进程已过半，节奏非常稳健！';
                } else {
                    document.getElementById('quote-text').textContent = '星光不问赶路人，准备出发。';
                }
            }

            render() {
                const container = document.getElementById('tasks-container');
                const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
                let filtered = this.tasks.filter(task => {
                    if (this.activeFilter === 'recurring') return task.type === 'recurring';
                    if (this.activeFilter === 'temporary') return task.type === 'temporary';
                    if (this.activeFilter === 'completed') return task.completed;
                    return true;
                }).filter(task => task.text.toLowerCase().includes(searchQuery));

                this.updateDashboard();

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <p>没有匹配的日程计划，在上方添加一个吧</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = filtered.map(task => {
                    const isRecurring = task.type === 'recurring';
                    const priorityClass = `badge-priority-${task.priority}`;
                    const priorityText = task.priority === 'high' ? '高优' : task.priority === 'medium' ? '常规' : '从缓';
                    const safeId = this.escapeHTML(task.id);
                    return `
                        <div class="task-card ${isRecurring ? 'type-recurring' : 'type-temporary'} ${task.completed ? 'completed' : ''}" data-id="${safeId}">
                            <div class="task-left">
                                <div class="drag-handle" title="拖拽排序" aria-label="拖拽排序" role="button" tabindex="0">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                        <circle cx="8" cy="4" r="2"/><circle cx="16" cy="4" r="2"/>
                                        <circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/>
                                        <circle cx="8" cy="20" r="2"/><circle cx="16" cy="20" r="2"/>
                                    </svg>
                                </div>
                                <label class="checkbox-container" title="标记完成">
                                    <input type="checkbox" ${task.completed ? 'checked' : ''} aria-label="标记日程完成" onchange="app.toggleTask('${safeId}')">
                                    <span class="custom-checkmark">
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </span>
                                </label>
                                <div class="task-details">
                                    <div class="task-text" title="双击可快速编辑名称" ondblclick="app.startInlineEdit(event, '${safeId}')">${this.escapeHTML(task.text)}</div>
                                    <div class="task-meta">
                                        <span class="badge ${isRecurring ? 'badge-type-recurring' : 'badge-type-temp'}">${isRecurring ? '🔁 每日循环' : '⚡ 今日临时'}</span>
                                        <span class="badge ${priorityClass}">${priorityText}</span>
                                        <span class="badge badge-category">${this.escapeHTML(task.category)}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="task-right">
                                <button class="action-btn edit" title="编辑日程" aria-label="编辑日程" onclick="app.openEditModal('${safeId}')">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg>
                                </button>
                                <button class="action-btn delete" title="删除计划" aria-label="删除计划" onclick="app.deleteTask('${safeId}')">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            startInlineEdit(event, id) {
                event.stopPropagation();
                const textEl = event.currentTarget;
                const oldText = textEl.textContent;
                const input = document.createElement('input');
                input.type = 'text';
                input.value = oldText;
                input.className = 'task-input';
                input.maxLength = 120;
                input.style.padding = '4px 8px';
                input.style.fontSize = '0.95rem';
                let finished = false;

                const finishEdit = () => {
                    if (finished) return;
                    finished = true;
                    const newText = input.value.trim();
                    if (newText && newText !== oldText) this.editTask(id, newText);
                    else textEl.textContent = oldText;
                };

                input.addEventListener('blur', finishEdit);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                    if (e.key === 'Escape') { input.value = oldText; input.blur(); }
                });

                textEl.innerHTML = '';
                textEl.appendChild(input);
                input.focus();
                input.select();
            }

            escapeHTML(str) {
                return String(str ?? '').replace(/[&<>'"]/g, tag => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[tag] || tag));
            }
        }

        // 启动系统
        WallpaperManager.init();
        const app = new TaskManager();

        // 首次交互预热音频上下文
        window.addEventListener('pointerdown', () => SoundFX.init(), { once: true });
    </script>
</body>
</html>
